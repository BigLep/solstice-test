name: Upgrade

# One step of an SRA/SWA implementation upgrade, dispatched from the Actions tab so the record lives in a run.
# Each job is a thin wrapper around tools/upgrade.py; see docs/UPGRADE.md for the sequence. Always dispatch with
# the release tag as the ref. Both contracts are upgraded together, so every operation takes both addresses.
#   rehearse, status  read-only, no secrets
#   verify            read-only on chain; appends the result to the GitHub release (needs contents: write)
#   propose, execute  run in the network's environment, which holds DEPLOYER_PRIVATE_KEY and whose required
#                     reviewers (with self-review prevented) provide the dispatcher-plus-approver sign-off
on:
  workflow_dispatch:
    inputs:
      network:
        description: Target network
        required: true
        type: choice
        options:
          - Calibnet
          - Mainnet
      operation:
        description: Step to run (see docs/UPGRADE.md)
        required: true
        type: choice
        options:
          - rehearse
          - propose
          - status
          - execute
          - verify
      sra_implementation:
        description: New SRA implementation address (required for propose, status, execute; optional for rehearse)
        required: false
        type: string
      swa_implementation:
        description: New SWA implementation address (required for propose, status, execute; optional for rehearse)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: upgrade-${{ inputs.network }}
  cancel-in-progress: false

env:
  OPERATION: ${{ inputs.operation }}
  SRA: ${{ inputs.sra_implementation }}
  SWA: ${{ inputs.swa_implementation }}
  NETWORK_NAME: ${{ inputs.network }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  readonly:
    if: ${{ inputs.operation == 'rehearse' || inputs.operation == 'status' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          network: ${{ inputs.network }}
      - name: Run
        run: |
          set -o pipefail
          uv run --quiet --locked tools/upgrade.py "$OPERATION" ${SRA:+--sra "$SRA"} ${SWA:+--swa "$SWA"} 2>&1 | tee "$RUNNER_TEMP/out.txt"
      - uses: ./.github/actions/summary
        if: always()
        with:
          title: "${{ inputs.operation }} on ${{ inputs.network }} (${{ github.sha }})"
          log: ${{ runner.temp }}/out.txt

  verify:
    if: ${{ inputs.operation == 'verify' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # appends the result to the release
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          network: ${{ inputs.network }}
      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          uv run --quiet --locked tools/upgrade.py verify --record-release 2>&1 | tee "$RUNNER_TEMP/out.txt"
      - uses: ./.github/actions/summary
        if: always()
        with:
          title: "verify on ${{ inputs.network }} (${{ github.sha }})"
          log: ${{ runner.temp }}/out.txt

  signed:
    if: ${{ inputs.operation == 'propose' || inputs.operation == 'execute' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.network == 'Mainnet' && 'mainnet' || 'calibnet' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          network: ${{ inputs.network }}
      - name: Run
        env:
          # One operations key: it deploys implementations (Deploy Contract), proposes (registered as a proposer
          # on the owner Safes) and executes. It has no power over the contracts.
          PROPOSER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          set -o pipefail
          uv run --quiet --locked tools/upgrade.py "$OPERATION" --sra "$SRA" --swa "$SWA" 2>&1 | tee "$RUNNER_TEMP/out.txt"
      - uses: ./.github/actions/summary
        if: always()
        with:
          title: "${{ inputs.operation }} on ${{ inputs.network }} (${{ github.sha }}, by ${{ github.actor }})"
          log: ${{ runner.temp }}/out.txt
